# Build y push de la imagen del backend a Amazon ECR.
# Se activa en tags v* o manualmente (workflow_dispatch).
#
# Secrets / variables de repositorio necesarios:
#   AWS_ROLE_TO_ASSUME   — ARN del rol IAM con trust a GitHub OIDC (recomendado)
#   o AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY (menos ideal)
#
# Variables:
#   AWS_REGION           — ej. us-east-1
#   ECR_REPOSITORY       — nombre del repo ECR (ej. superozono-prod-api)

name: Publish API image to ECR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de imagen (default: sha corto)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Build & push backend
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'superozono-prod-api' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: ${{ secrets.AWS_ROLE_TO_ASSUME == '' && secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="sha-${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using tag: $TAG"

      - name: Build, tag and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          IMAGE="$REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE:$TAG" -t "$IMAGE:latest" ./backend
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "### Pushed \`$IMAGE:$TAG\`" >> "$GITHUB_STEP_SUMMARY"
