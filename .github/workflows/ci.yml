name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, tipos y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: superozono_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: flake8
        run: flake8 app/ tests/

      - name: mypy
        run: mypy app/

      - name: Migraciones + alembic check (drift #10)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/superozono_migcheck"
          SECRET_KEY: "ci-secret-key-solo-para-tests-0123456789abcdef"
          SEED_ADMIN_PASSWORD: "ci-admin-pass-no-produccion"
        run: |
          python - <<'PY'
          import asyncio, asyncpg
          async def main():
              conn = await asyncpg.connect("postgresql://postgres:postgres@localhost:5432/postgres")
              try:
                  await conn.execute("CREATE DATABASE superozono_migcheck")
              except asyncpg.exceptions.DuplicateDatabaseError:
                  pass
              finally:
                  await conn.close()
          asyncio.run(main())
          PY
          python -m alembic upgrade head
          python -m alembic check

      - name: pytest (con cobertura)
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/superozono_test"
          TEST_DATABASE_URL: "postgresql+asyncpg://postgres:postgres@localhost:5432/superozono_test"
          SECRET_KEY: "ci-secret-key-solo-para-tests-0123456789abcdef"
          SEED_ADMIN_PASSWORD: "ci-admin-pass-no-produccion"
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  security:
    name: Seguridad — auditoría de dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: pip-audit
        run: |
          pip install pip-audit
          # Sin excepciones: la migracion de python-jose a PyJWT (jul-2026) elimino
          # la dep transitiva ecdsa, por lo que PYSEC-2026-1325 ya no aplica.
          pip-audit -r requirements.txt --desc off

  frontend:
    name: Frontend — lint, tipos y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E — smoke Playwright (informativo; no bloquea merge)
    runs-on: ubuntu-latest
    # #27: sigue continue-on-error hasta estabilizar en todos los runners;
    # el job se reporta y se revisa en cada release (PENDIENTES).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependencias backend
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E
        working-directory: frontend
        env:
          CI: true
        run: npm run test:e2e
