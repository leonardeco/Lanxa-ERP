name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — lint, tipos y tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: flake8
        run: flake8 app/ tests/

      - name: mypy
        run: mypy app/

      - name: pytest (con cobertura)
        env:
          DATABASE_URL: "sqlite+aiosqlite:///./test_ci.db"
          SECRET_KEY: "ci-secret-key-solo-para-tests-0123456789abcdef"
          SEED_ADMIN_PASSWORD: "ci-admin-pass-no-produccion"
        run: pytest -q --cov=app --cov-report=term-missing:skip-covered

  security:
    name: Seguridad — auditoría de dependencias
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --desc off

  frontend:
    name: Frontend — lint, tipos y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Vitest
        run: npm run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E — smoke Playwright (opcional, no bloquea)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Dependencias backend
        working-directory: backend
        run: pip install -r requirements.txt

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Chromium de Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Smoke E2E
        working-directory: frontend
        run: npm run test:e2e
