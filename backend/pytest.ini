[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
addopts = -v
pythonpath = .
markers =
    no_db: test unitario puro sin PostgreSQL (omite setup_db autouse)
filterwarnings =
    ; slowapi busca un env file propio que no usamos — warning interno de la librería
    ignore:Config file 'slowapi_unused.env' not found.:UserWarning
